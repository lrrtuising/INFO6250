version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lesson2_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: bookdb
      MYSQL_USER: bookdbuser
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql